[project]
name = "bc-code-atlas-aggregator"
version = "0.1.0"
description = "Single MCP endpoint aggregating bc-code-atlas's search and graph servers"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["unified_mcp_server"]
